name: Payments and shop regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d store_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/store_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_admin.cjs tests/test_storefront_ui.cjs
      - run: node --check admin.js
      - run: node --check storefront/shop.js
