build:
  system: auto
  command: "pip install -r requirements.txt"
  min_cpu: 0.5
  max_cpu: 1
  min_memory: 512
  max_memory: 1024

start_command: "python bot.py"

# В боте может быть ровно один polling-процесс: иначе Telegram вернёт Conflict.
scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 128
  max_memory: 256

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
